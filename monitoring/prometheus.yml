global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'product-service:8080'

  - job_name: 'account-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'account-service:8080'

  - job_name: 'kong'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'kong:8000'
