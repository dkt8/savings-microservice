apiVersion: v1
kind: ConfigMap
metadata:
  name: product-db-init-sql
  namespace: microbank
data:
  init.sql: |-
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    CREATE TABLE IF NOT EXISTS saving_products (
        id UUID PRIMARY KEY,
        product_code VARCHAR(50) UNIQUE,
        product_name VARCHAR(255),
        tenor_months INT,
        interest_rate NUMERIC(10,4),
        currency VARCHAR(10),
        active BOOLEAN,
        created_at TIMESTAMP
    );

    INSERT INTO saving_products (id, product_code, product_name, tenor_months, interest_rate, currency, active, created_at)
    VALUES
        ('11111111-1111-1111-1111-111111111111', 'SP001', 'Tiết kiệm trách nhiệm', 6, 4.25, 'VND', true, NOW()),
        ('22222222-2222-2222-2222-222222222222', 'SP002', 'Tiết kiệm linh hoạt', 12, 5.10, 'VND', true, NOW()),
        ('33333333-3333-3333-3333-333333333333', 'SP003', 'Tiết kiệm Tết', 24, 5.75, 'VND', true, NOW())
    ON CONFLICT (product_code) DO NOTHING;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: product-db-pvc
  namespace: microbank
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-db
  namespace: microbank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-db
  template:
    metadata:
      labels:
        app: product-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: productservicebank
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: product-db-pvc
        - name: init-sql
          configMap:
            name: product-db-init-sql
            items:
              - key: init.sql
                path: init.sql
---
apiVersion: v1
kind: Service
metadata:
  name: product-db
  namespace: microbank
spec:
  selector:
    app: product-db
  ports:
    - port: 5432
      targetPort: 5432
