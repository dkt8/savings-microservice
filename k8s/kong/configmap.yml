apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: microbank
data:
  kong.yml: |-
    _format_version: "3.0"

    services:
      - name: product-service
        url: http://product-service:8080

        routes:
          - name: product-route
            paths:
              - /api/v1/products
            strip_path: false

        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:3000

              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS

              headers:
                - Accept
                - Authorization
                - Content-Type

              exposed_headers:
                - Authorization

              credentials: true

              max_age: 3600

      - name: account-service
        url: http://account-service:8080

        routes:
          - name: account-route
            paths:
              - /api/v1/accounts
            strip_path: false

        plugins:
          - name: cors
            config:
              origins:
                - http://localhost:3000

              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS

              headers:
                - Accept
                - Authorization
                - Content-Type

              exposed_headers:
                - Authorization

              credentials: true

              max_age: 3600

    plugins:
      - name: prometheus
